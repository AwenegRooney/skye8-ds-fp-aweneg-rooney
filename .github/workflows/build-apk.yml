name: Build Benchmark Flutter APK

on:
  push:
    branches: [main, feature/**]
    paths:
      - 'stage_a_test_app/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'
      
      - name: Get dependencies
        working-directory: stage_a_test_app
        run: flutter pub get

      - name: Generate Android files
        working-directory: stage_a_test_app
        run: flutter create . --org com.example --platforms android

      - name: Fix Android SDK versions
        working-directory: stage_a_test_app
        run: |
          sed -i 's/flutter.minSdkVersion/26/g' android/app/build.gradle
          sed -i 's/flutter.compileSdkVersion/34/g' android/app/build.gradle
          sed -i 's/flutter.targetSdkVersion/34/g' android/app/build.gradle
      
      - name: Build APK
        working-directory: stage_a_test_app
        run: flutter build apk --release --split-per-abi --tree-shake-icons
      
      - name: Upload arm64-v8a APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-release
          path: stage_a_test_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 7

      - name: Upload armeabi-v7a APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-armeabi-v7a-release
          path: stage_a_test_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          retention-days: 7

      - name: Upload x86_64 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-x86_64-release
          path: stage_a_test_app/build/app/outputs/flutter-apk/app-x86_64-release.apk
          retention-days: 7

      - name: Upload APKs to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            stage_a_test_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            stage_a_test_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            stage_a_test_app/build/app/outputs/flutter-apk/app-x86_64-release.apk