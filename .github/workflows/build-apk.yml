      - name: Build APK
        working-directory: stage_a_test_app
        run: flutter build apk --release --split-per-abi --tree-shake-icons

      - name: Upload arm64-v8a APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-release
          path: stage_a_test_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 7

      - name: Upload armeabi-v7a APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-armeabi-v7a-release
          path: stage_a_test_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          retention-days: 7

      - name: Upload x86_64 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-x86_64-release
          path: stage_a_test_app/build/app/outputs/flutter-apk/app-x86_64-release.apk
          retention-days: 7

      - name: Upload APKs to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            stage_a_test_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            stage_a_test_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            stage_a_test_app/build/app/outputs/flutter-apk/app-x86_64-release.apk