name: Build Benchmark Flutter APK

on:
  push:
    branches: [main, feature/**]
    paths:
      - 'stage_a_test_app/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Accept Android licenses & install SDK 36
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          
          yes | sdkmanager --licenses > /dev/null || true
          
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Get dependencies
        working-directory: stage_a_test_app
        run: flutter pub get

      - name: Generate Android files
        working-directory: stage_a_test_app
        run: flutter create . --org com.example --platforms android --overwrite

      - name: Fix Android / Kotlin / AGP versions
        working-directory: stage_a_test_app
        run: |
