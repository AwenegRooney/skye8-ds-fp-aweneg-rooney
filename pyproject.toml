[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "model_mobile_wrapper"
version = "1.0.0"
description = "On-Device Model Serving Layer: Compress and serve ML models offline on cheap Android phones"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Aweneg Rooney Oburi", email = "awenegrooney237@gmail.com"}
]
dependencies = [
    "tensorflow>=2.13.0",
    "tf-keras>=2.13.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "matplotlib>=3.7.0",
    "tensorflow-model-optimization>=0.7.0",
    "click>=8.1.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "black>=23.9.0",
    "mypy>=1.5.0",
    "pre-commit>=3.4.0",
]

[project.scripts]
convert-model = "src.tools.convert_model:main"
benchmark-model = "src.benchmark:main"
generate-report = "src.tools.report_generator:main"

[tool.setuptools]
packages = ["src", "src.compression", "src.tools", "src.utils"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "W", "F", "I", "C", "B", "UP"]
ignore = ["E501", "B008"]
exclude = [".git", ".venv", "build", "dist", "models", "__pycache__"]

[tool.mypy]
python_version = "3.9"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --cov=src --cov-report=term-missing"